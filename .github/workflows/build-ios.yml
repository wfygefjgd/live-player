name: Build iOS App

on:
  push:
    tags:
      - 'v*-ios'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: TVPlayer-iOS
        run: xcodegen generate

      - name: Build iOS App
        working-directory: TVPlayer-iOS
        run: |
          xcodebuild \
            -project TVPlayer.xcodeproj \
            -scheme TVPlayer_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TVPlayer.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-ios}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # 优先读 target 级 MARKETING_VERSION（最后一次出现）
            VERSION=$(grep 'MARKETING_VERSION:' TVPlayer-iOS/project.yml | tail -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Export IPA
        working-directory: TVPlayer-iOS
        run: |
          mkdir -p build/Payload
          cp -r build/TVPlayer.xcarchive/Products/Applications/TVPlayer_iOS.app build/Payload/
          cd build
          zip -r TVPlayer-v${{ steps.get_version.outputs.version }}-ios.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TVPlayer-iOS
          path: TVPlayer-iOS/build/TVPlayer-v${{ steps.get_version.outputs.version }}-ios.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TVPlayer-iOS/build/TVPlayer-v${{ steps.get_version.outputs.version }}-ios.ipa
          body_path: RELEASE_NOTES_iOS_v${{ steps.get_version.outputs.version }}.md
          name: TVPlayer iOS v${{ steps.get_version.outputs.version }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
