name: Build Android APK

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Get version
        id: ver
        working-directory: .
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-android}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep versionName android-native/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Assemble Release
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found: $APK"
          OUT="TVPlayer-安卓TV-v${{ steps.ver.outputs.version }}-release.apk"
          cp "$APK" "$GITHUB_WORKSPACE/$OUT"
          echo "file=$OUT" >> $GITHUB_OUTPUT
          ls -la "$GITHUB_WORKSPACE/$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVPlayer-Android
          path: ${{ github.workspace }}/${{ steps.apk.outputs.file }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/${{ steps.apk.outputs.file }}
          body_path: RELEASE_NOTES_Android_v${{ steps.ver.outputs.version }}.md
          name: TVPlayer 安卓&TV v${{ steps.ver.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
