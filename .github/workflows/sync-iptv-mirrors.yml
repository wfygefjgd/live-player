name: Sync IPTV Mirrors

on:
  schedule:
    # 每天北京时间 6:00 (UTC 22:00) 自动更新
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPTV sources
        run: |
          mkdir -p iptv-mirrors

          echo "📥 Downloading BurningC4 Chinese-IPTV..."
          curl -fsSL "https://raw.githubusercontent.com/BurningC4/Chinese-IPTV/master/TV-IPV4.m3u" \
            -o iptv-mirrors/burningc4-chinese-iptv.m3u || echo "Failed to download BurningC4"

          echo "📥 Downloading zbefine IPTV..."
          curl -fsSL "https://raw.githubusercontent.com/zbefine/iptv/main/iptv.m3u" \
            -o iptv-mirrors/zbefine-iptv.m3u || echo "Failed to download zbefine"

          echo "📥 Downloading suxuang myIPTV..."
          curl -fsSL "https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv6.m3u" \
            -o iptv-mirrors/suxuang-myiptv.m3u || echo "Failed to download suxuang"

      - name: Generate index
        run: |
          cat > iptv-mirrors/README.md << 'EOF'
          # IPTV 源镜像

          自动同步的 IPTV 源镜像，解决国内无代理无法访问 GitHub raw 的问题。

          ## 可用镜像

          | 源名称 | 原始地址 | 镜像地址 |
          |--------|---------|---------|
          | BurningC4 Chinese-IPTV | [GitHub](https://github.com/BurningC4/Chinese-IPTV) | [burningc4-chinese-iptv.m3u](burningc4-chinese-iptv.m3u) |
          | zbefine IPTV | [GitHub](https://github.com/zbefine/iptv) | [zbefine-iptv.m3u](zbefine-iptv.m3u) |
          | suxuang myIPTV | [GitHub](https://github.com/suxuang/myIPTV) | [suxuang-myiptv.m3u](suxuang-myiptv.m3u) |

          ## 更新频率

          每天自动同步一次（北京时间 6:00）

          ## 访问方式

          通过 GitHub Pages 访问：
          ```
          https://wfygefjgd.github.io/live-player/iptv-mirrors/burningc4-chinese-iptv.m3u
          https://wfygefjgd.github.io/live-player/iptv-mirrors/zbefine-iptv.m3u
          https://wfygefjgd.github.io/live-player/iptv-mirrors/suxuang-myiptv.m3u
          ```

          最后更新时间：$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iptv-mirrors/
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "自动同步 IPTV 镜像源 $(date -u +"%Y-%m-%d")"
            git push
            echo "✅ IPTV mirrors updated successfully"
          fi
