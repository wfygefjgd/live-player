name: TVPlayer
options:
  bundleIdPrefix: org.tvplayer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.9.6"
    CURRENT_PROJECT_VERSION: "196"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  TVPlayer_iOS:
    type: application
    platform: iOS
    sources:
      - path: TVPlayer_iOS
    resources:
      - TVPlayer_iOS/Resources/validated-channels.json
    info:
      path: TVPlayer_iOS/Info.plist
      properties:
        CFBundleDisplayName: TVPlayer 正式版
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiredDeviceCapabilities: ["arm64"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIPreferredHomeIndicatorAutoHidden: true
        UIRequiresFullScreen: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: "用于加载直播源与频道列表"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        INFOPLIST_FILE: TVPlayer_iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.tvplayer.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies: []
